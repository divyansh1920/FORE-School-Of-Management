            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 0.05em;

            box-shadow: 0 6px 24px rgba(26,86,219,0.4);
            position: relative;
            overflow: hidden;
        }

        .form-button #btn2::after,
        .form-button #btn3::after,
        .form-button #btn4::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .form-button #btn2:hover::after,
        .form-button #btn3:hover::after,
        .form-button #btn4:hover::after { left: 150%; }

        .form-button #btn2:hover,
        .form-button #btn3:hover,

                opacity: 0;
                transform: scale(2);

            51% {
                opacity: 0;
                transform: scale(0);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        /*CSS for Loader start*/
        /* Absolute Center Spinner */
        .loading {
            position: fixed;
            height: 2em;
            width: 2em;
            overflow: visible;
            margin: auto;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 2000;
        }

        /* Transparent Overlay */
        .loading:before {
            content: '';
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
        }

        /* :not(:required) hides these rules from IE9 and below */
        .loading:not(:required) {
            /* hide "loading..." text */
            font: 0/0 a;
            color: transparent;
            text-shadow: none;
            background-color: transparent;
            border: 0;
        }

        .loading:not(:required):after {
            content: '';
            display: block;
            font-size: 10px;
            width: 1em;
            height: 1em;
            margin-top: -0.5em;
            -webkit-animation: spinner 1500ms infinite linear;
            -moz-animation: spinner 1500ms infinite linear;
            -ms-animation: spinner 1500ms infinite linear;
            -o-animation: spinner 1500ms infinite linear;
            animation: spinner 1500ms infinite linear;
            border-radius: 0.5em;
            -webkit-box-shadow: rgba(0, 0, 0, 0.75) 1.5em 0 0 0, rgba(0, 0, 0, 0.75) 1.1em 1.1em 0 0, rgba(0, 0, 0, 0.75) 0 1.5em 0 0, rgba(0, 0, 0, 0.75) -1.1em 1.1em 0 0, rgba(0, 0, 0, 0.5) -1.5em 0 0 0, rgba(0, 0, 0, 0.5) -1.1em -1.1em 0 0, rgba(0, 0, 0, 0.75) 0 -1.5em 0 0, rgba(0, 0, 0, 0.75) 1.1em -1.1em 0 0;
            box-shadow: rgba(0, 0, 0, 0.75) 1.5em 0 0 0, rgba(0, 0, 0, 0.75) 1.1em 1.1em 0 0, rgba(0, 0, 0, 0.75) 0 1.5em 0 0, rgba(0, 0, 0, 0.75) -1.1em 1.1em 0 0, rgba(0, 0, 0, 0.75) -1.5em 0 0 0, rgba(0, 0, 0, 0.75) -1.1em -1.1em 0 0, rgba(0, 0, 0, 0.75) 0 -1.5em 0 0, rgba(0, 0, 0, 0.75) 1.1em -1.1em 0 0;
        }

        /* Animation */
        @-webkit-keyframes spinner {
            0% {
                -webkit-transform: rotate(0deg);
                -moz-transform: rotate(0deg);
                -ms-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -ms-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @-moz-keyframes spinner {
            0% {
                -webkit-transform: rotate(0deg);
                -moz-transform: rotate(0deg);
                -ms-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -ms-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @-o-keyframes spinner {
            0% {
                -webkit-transform: rotate(0deg);
                -moz-transform: rotate(0deg);
                -ms-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -ms-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

        @keyframes  spinner {
            0% {
                -webkit-transform: rotate(0deg);
                -moz-transform: rotate(0deg);
                -ms-transform: rotate(0deg);
                -o-transform: rotate(0deg);
                transform: rotate(0deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -ms-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- home page script start -->

    <script type="text/javascript">
        // registration form script start   

        $('#btn1').on("click", function() {
            // alert("ddd");
            var name = $('#name').val();
            var email = $('#email').val();
            var mobile = $('#mobile').val();
            var state = $('#state').val();
            var emailExp = /^[^\s()<>@,;:\/]+@\w[\w\.-]+\.[a-z]{2,}$/i;

            $('#errorName').text('');
            $('#errorEmail').text('');
            $('#errorMobile').text('');
            $('#errorState').text('');
            $('#errorLog').text('');

            if (name == "") {
                $('#errorName').text('Name is required');
                $('#name').focus();
            } else if (email == "") {
                $('#errorEmail').text('Roll Number is required');
                $('#email').focus();
            } else if (!emailExp.test(email)) {
                $('#errorEmail').text('Email is invalid.');
                $('#email').focus();
            } else if (mobile == "") {
                $('#errorMobile').text('Mobile is required');
                $('#mobile').focus();
            } else if (mobile.length != 10) {
                $('#errorMobile').text('Mobile is invalid');
                $('#mobile').focus();
            } else if (state == "") {
                $('#errorState').text('State is required');
                $('#state').focus();
            } else {
                $('.loading').show();
                $.ajax({
                    headers: {
                        'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                    },
                    url: "https://student.fsm.ac.in/store",
                    data: {
                        'name': name,
                        'email': email,
                        'state': state,
                        'mobile': mobile
                    },
                    type: 'post',
                    success: function(response) {
                        $('.loading').hide();
                        var result = jQuery.parseJSON(response);
                        // console.log("===== " + result.status + " =====");
                        if (result.status == 0) {
                            $('#errorLog').text('Failed! Email is already registred.');
                        } else if (result.status == 1) {
                            $('#errorLog').text('Failed! Mobile No. is already registred.');
                        } else if (result.status == 2) {
                            $('#errorLog').text('Failed! Fail to register.');
                        } else if (result.status == 3) {
                            $('#errorLog').text('Registration is completed. But Failed to send verification link.');
                        } else if (result.status == 4) {
                            location.href = result.redirect;
                        } else {
                            $('#errorLog').text('Failed! Fail to register. Please try again after sometime');
                        }
                    }
                });
            }
        });
        // registration form script end


        $(document).keypress(function(e) {

            if (e.which === 13) {

                $('#btn2').trigger('click');
            }
        });


        // Login form script start

$('#btn2').off('click').on('click', function (event) {
    event.preventDefault();
    window.location.href = './home.html';
});

// Login form script end

        // Verify email form script start   

        $('#btn3').on("click", function() {

            // alert("ddd");
            var email = $('#verify_email').val();
            var emailExp = /^[^\s()<>@,;:\/]+@\w[\w\.-]+\.[a-z]{2,}$/i;

            $('#errorVerifyEmail').text('');
            $('#errorVerifyLog').text('');
            $('#successVerifyLog').text('');

            if (email == "") {
                $('#errorVerifyEmail').text('Roll Number is required');
                $('#verify_email').focus();
            } else if (!emailExp.test(email)) {
                $('#errorVerifyEmail').text('Email is invalid.');
                $('#verify_email').focus();
            } else {
                $('.loading').show();
                $.ajax({
                    headers: {
                        'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                    },
                    url: "https://student.fsm.ac.in/resend-email-verify",
                    data: {
                        'email': email
                    },
                    type: 'post',
                    success: function(response) {
                        $('.loading').hide();
                        var result = jQuery.parseJSON(response);
                        // console.log("===== " + result.status + " =====");

                        $('#verify_email').val('');
                        if (result.status == 0) {
                            $('#errorVerifyLog').text('Failed to send verification link.');
                        } else if (result.status == 1) {
                            $('#successVerifyLog').text('Please check email for verification link.');
                            $('#verify_email_div').css('display', 'none');
                            $('#btn3').css('display', 'none');
                        } else if (result.status == 2) {
                            $('#errorVerifyLog').text('Failed! Email does not exists.');
                        } else if (result.status == 3) {
                            $('#successVerifyLog').text('Email is already verified.');
                            $('#verify_email_div').css('display', 'none');
                            $('#btn3').css('display', 'none');
                        } else {
                            $('#errorVerifyLog').text('Failed! Please try again after sometime.');
                        }
                    }
                });
            }
        });
        // verify email form script end


        // forgot password email form script start   

        $('#btn4').on("click", function() {
            var email = $('#forgot_email').val();
            var emailExp = /^[^\s()<>@,;:\/]+@\w[\w\.-]+\.[a-z]{2,}$/i;

            $('#errorForgotEmail').text('');
            $('#errorForgotLog').text('');
            $('#successForgotLog').text('');

            if (email == "") {
                $('#errorForgotEmail').text('Roll Number is required');
                $('#verify_email').focus();
                return;
            }

            if (!emailExp.test(email)) {
                $('#errorForgotEmail').text('Email is invalid.');
                $('#forgot_email').focus();
                return;
            }

            $('.loading').show();

            $.ajax({
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                },
                url: "https://student.fsm.ac.in/send-forgot-email",
                data: {
                    email: email
                },
                type: 'POST',
                dataType: 'json',
                success: function(result) {
                    $('.loading').hide();
                    console.log(result);

                    $('#forgot_email').val('');

                    if (result.status == 0) {
                        $('#errorForgotLog').text('Failed! Email does not exist.');
                    } else if (result.status == 1) {
                        $('#errorForgotLog').text('Failed! Email is not verified yet.');
                    } else if (result.status == 2) {
                        $('#errorForgotLog').text(result.message);
                    } else if (result.status == 3) {
                        $('#successForgotLog').text('Please check email for reset password link.');
                        $('#forgot_email_div').hide();
                        $('#btn4').hide();
                    } else {
                        $('#errorForgotLog').text('Failed! Please try again later.');
                    }
                },
                error: function(xhr) {
                    $('.loading').hide();
                    console.error(xhr.responseText);
                    $('#errorForgotLog').text('Server error! Please try again later.');
                }
            });
        });

        // forgot password email form script end

        function showDiv($val) {
            var form = $val;
            if (form == 1) {
                $('#registration-form').css('display', 'none');
                $('#email-form').css('display', 'none');
                $('#forgot-form').css('display', 'none');

                $('#login-form').css('display', 'block');
            } else if (form == 2) {
                $('#registration-form').css('display', 'block');
                $('#login-form').css('display', 'none');
                $('#email-form').css('display', 'none');
                $('#forgot-form').css('display', 'none');
            } else if (form == 3) {
                $('#registration-form').css('display', 'none');
                $('#login-form').css('display', 'none');
                $('#forgot-form').css('display', 'none');

                $('#email-form').css('display', 'block');
                $('#verify_email_div').css('display', 'block');
                $('#verify_email').val('');
                $('#errorVerifyLog').text('');
                $('#successVerifyLog').text('');
            } else if (form == 4) {
                $('#registration-form').css('display', 'none');
                $('#login-form').css('display', 'none');
                $('#email-form').css('display', 'none');

                $('#forgot-form').css('display', 'block');
                $('#forgot_email_div').css('display', 'block');
                $('#forgot_email').val('');
                $('#errorForgotLog').text('');
                $('#successForgotLog').text('');
            }
        }
        // show div function end

        function onlynumbers(e, t) {
            try {
                if (window.event) {
                    var charCode = window.event.keyCode;
                } else if (e) {
                    var charCode = e.which;
                } else {
                    return true;
                }
                // alert(charCode);
                if ((charCode >= 48 && charCode <= 57))
                    return true;
                else
                    return false;
            } catch (err) {
                alert(err.Description);
            }
        }

        function decimalNumbers(e, t) {
            try {
                if (window.event) {
                    var charCode = window.event.keyCode;
                } else if (e) {
                    var charCode = e.which;
                } else {
                    return true;
                }
                // alert(charCode);
                if ((charCode >= 48 && charCode <= 57) || (charCode == 46))
                    return true;
                else
                    return false;
            } catch (err) {
                alert(err.Description);
            }
        }


        function onlyAlphabets(e, t) {
            try {
                if (window.event) {
                    var charCode = window.event.keyCode;
                } else if (e) {
                    var charCode = e.which;
                } else {
                    return true;
                }
                if ((charCode > 64 && charCode < 91) || (charCode > 96 && charCode < 123) || (charCode == 32))
                    return true;
                else
                    return false;
            } catch (err) {
                alert(err.Description);
            }
        }



        function onlyAlphaNumeric(e) {
            var keyCode = e.which;

            // Not allow special 
            if (!((keyCode >= 48 && keyCode <= 57) ||
                    (keyCode >= 65 && keyCode <= 90) ||
                    (keyCode >= 97 && keyCode <= 122)) &&
                keyCode != 8 && keyCode != 32 && keyCode != 39 && keyCode != 44) {
                e.preventDefault();
            }
        }
